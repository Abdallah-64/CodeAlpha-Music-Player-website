<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern JavaScript music player." />
    <title>Sonus | Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Sonus home"
        >SONUS<span>.</span></a
      >
      <nav class="navbar" aria-label="Main navigation">
        <a class="active" href="#player">Now playing</a>
        <a href="#playlist">Playlist</a>
      </nav>
      <button
        class="icon-button theme-button"
        type="button"
        aria-label="Switch to light theme"
        title="Switch theme"
      >
        <span aria-hidden="true">☼</span>
      </button>
    </header>

    <main id="top">
      <div class="ambient-glow" aria-hidden="true"></div>
      <section
        class="player-layout"
        id="player"
        aria-labelledby="player-heading"
      >
        <article class="player-card">
          <div class="artwork-wrap">
            <img
              id="cover"
              src="https://images.unsplash.com/photo-1619983081563-430f63602796?auto=format&fit=crop&w=1000&q=85"
              alt="Abstract blue artwork for Echoes of Tomorrow"
            />
            <div class="artwork-shine" aria-hidden="true"></div>
          </div>

          <div class="track-details">
            <p class="eyebrow">Now playing</p>
            <h1 id="player-heading">Echoes of Tomorrow</h1>
            <p id="artist">Synthetic Waveform</p>
          </div>

          <div class="timeline" aria-label="Playback position">
            <div class="time-labels">
              <span id="current-time">0:00</span><span id="duration">0:00</span>
            </div>
            <input
              id="progress"
              class="range-input"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Song progress"
            />
          </div>

          <div class="controls">
            <button
              id="previous"
              class="control-button"
              type="button"
              aria-label="Previous song"
              title="Previous song"
            >
              <span aria-hidden="true">⏮</span>
            </button>
            <button
              id="play-pause"
              class="play-button"
              type="button"
              aria-label="Play"
              title="Play"
            >
              <span id="play-icon" aria-hidden="true">▶</span>
            </button>
            <button
              id="next"
              class="control-button"
              type="button"
              aria-label="Next song"
              title="Next song"
            >
              <span aria-hidden="true">⏭</span>
            </button>
          </div>

          <div class="volume-control">
            <button
              id="mute"
              class="volume-icon"
              type="button"
              aria-label="Mute"
              title="Mute"
            >
              🔊
            </button>
            <input
              id="volume"
              class="range-input"
              type="range"
              min="0"
              max="1"
              value="0.7"
              step="0.01"
              aria-label="Volume"
            />
          </div>
          <audio id="audio" preload="metadata"></audio>
        </article>

        <aside
          class="playlist-card"
          id="playlist"
          aria-labelledby="playlist-heading"
        >
          <div class="playlist-heading">
            <div>
              <p class="eyebrow">Queue</p>
              <h2 id="playlist-heading">Up next</h2>
            </div>
            <span id="track-count">3 tracks</span>
          </div>
          <ol id="playlist-items" class="playlist-items"></ol>
        </aside>
      </section>
    </main>

    <footer>
      © <span id="year"></span> SONUS — Made for focused listening.
    </footer>
    <script src="js/script.js"></script>
  </body>
</html>
